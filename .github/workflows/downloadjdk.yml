name: Download Docker Image
on:
  workflow_dispatch:  # 手动触发

jobs:
  download-image:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker
      uses: docker/setup-buildx-action@v3
      
    - name: Pull and save Docker image
      run: |
        docker pull --platform linux/arm64 docker pull tomcat:9.0.112-jdk8@217f1165bc1adf5b6cefafb9e086eea977580696527c9d7bfef3734bbbbfb89f
        docker save -o tomcat9-arm.tar tomcat:9.0.112-jdk8
        ls -lh jdk8-arm.tar
        
    - name: Upload image artifact
      uses: actions/upload-artifact@v4
      with:
        name: tomcat9-image
        path: tomcat9-arm.tar
        retention-days: 7
